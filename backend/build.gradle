plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.skelar'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17   // builds on any JDK 17+
    targetCompatibility = JavaVersion.VERSION_17
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.anthropic:anthropic-java:2.34.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'live' }
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// ./gradlew liveEval — real Claude classifier on the 38 labelled tickets (needs ANTHROPIC_API_KEY)
tasks.register('liveEval', Test) {
    useJUnitPlatform { includeTags 'live' }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'defuse.llm.mode', 'live'
    testLogging { showStandardStreams = true }
}
