server:
  port: 8000
spring:
  datasource:
    url: jdbc:h2:mem:defuse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ${DEFUSE_H2_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql,classpath:db/views.sql
  config:
    import: classpath:defuse-policy.yml
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
defuse:
  llm:
    mode: ${DEFUSE_LLM_MODE:gold}          # gold | live | replay; no key needed for gold/replay
    provider: gemma
    model: ${DEFUSE_LLM_MODEL:gemma-4-26b-a4b-it}
    reply-model: ${DEFUSE_LLM_REPLY_MODEL:gemma-4-31b-it}
    api-key-env: GEMINI_API_KEY
    timeout-ms: 15000
    max-retries: 2
    json-mode: ${DEFUSE_LLM_JSON_MODE:false}
    response-schema: ${DEFUSE_LLM_RESPONSE_SCHEMA:false}
    # Greedy decoding: temperature 0 + top-k 1 gives repeatable output and no sampled inventions.
    classifier: {temperature: 0.0, top-p: 1.0, top-k: 1, seed: 7, max-output-tokens: 1024, thinking-level: minimal}
    reply: {temperature: 0.0, top-p: 1.0, top-k: 1, seed: 7, max-output-tokens: 400, thinking-level: minimal}
  max-ticket-chars: 5000
  cors-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:15173,http://127.0.0.1:15173

  datasources:
    customers: {type: json, path: data/customers.json}
    engagement: {type: json, path: data/usage.json}
    tickets: {type: json, path: data/tickets_eval.json}
  billing:
    - {processor: card, type: mock}
    - {processor: app_store, type: store}
    - {processor: google_play, type: store}
