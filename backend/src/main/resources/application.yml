server:
  port: 8000
spring:
  config:
    import: classpath:defuse-policy.yml
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
defuse:
  llm:
    mode: ${DEFUSE_LLM_MODE:gold}          # gold | live | replay; no key needed for gold/replay
    provider: gemma
    model: ${DEFUSE_LLM_MODEL:gemma-4-31b-it}
    api-key-env: GEMINI_API_KEY
    timeout-ms: 15000
    max-retries: 2
    json-mode: ${DEFUSE_LLM_JSON_MODE:false}
    response-schema: ${DEFUSE_LLM_RESPONSE_SCHEMA:false}
  max-ticket-chars: 5000
  cors-origins: http://localhost:5173,http://127.0.0.1:5173

  datasources:
    customers: {type: json, path: data/customers.json}
    engagement: {type: json, path: data/usage.json}
    tickets: {type: json, path: data/tickets_eval.json}
  billing:
    - {processor: card, type: mock}
    - {processor: app_store, type: store}
    - {processor: google_play, type: store}
